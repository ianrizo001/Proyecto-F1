
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Comparte tu opinión sobre la Fórmula 1 con F1 Apex.">
    <title>F1 Apex | Contacto</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1><i class="fa-solid fa-flag-checkered"></i> F1 Apex</h1>
        <nav aria-label="Navegación principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="historia.html">Historia</a></li>
                <li><a href="equipos.html">Equipos</a></li>
                <li><a href="circuitos.html">Circuitos</a></li>
                <li><a href="contacto.html" aria-current="page">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="my-4">
            <h2>Contacta con F1 Apex</h2>
            <p>
                Comparte tu opinión, selecciona tu equipo favorito
                y cuéntanos qué es lo que más te gusta de la Fórmula 1.
            </p>
        </section>

        <section class="my-4">
            <h2>Formulario de contacto</h2>

            <form id="formulario-contacto">
                <div>
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre"
                        minlength="3" maxlength="60" autocomplete="name" required>
                </div>

                <div>
                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo"
                        autocomplete="email" required>
                </div>

                <div>
                    <label for="edad">Edad:</label>
                    <input type="number" id="edad" name="edad"
                        min="13" max="100" required>
                </div>

                <div>
                    <label for="equipo">Equipo favorito:</label>
                    <select id="equipo" name="equipo" required>
                        <option value="">Selecciona un equipo</option>
                        <option value="Ferrari">Ferrari</option>
                        <option value="McLaren">McLaren</option>
                        <option value="Mercedes">Mercedes</option>
                        <option value="Red Bull Racing">Red Bull Racing</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>

                <div>
                    <label for="tema">Tema de interés:</label>
                    <select id="tema" name="tema" required>
                        <option value="">Selecciona un tema</option>
                        <option value="Historia">Historia de la F1</option>
                        <option value="Equipos">Equipos y pilotos</option>
                        <option value="Circuitos">Circuitos</option>
                        <option value="Noticias">Noticias de F1</option>
                    </select>
                </div>

                <div>
                    <label for="mensaje">Tu opinión:</label>
                    <textarea id="mensaje" name="mensaje" rows="5"
                        minlength="10" maxlength="500"
                        placeholder="Escribe tu opinión sobre la Fórmula 1..."
                        required></textarea>
                </div>

                <div class="checkbox-contenedor">
                    <input type="checkbox" id="acepto" name="acepto" required>
                    <label for="acepto">Confirmo que los datos proporcionados son correctos.</label>
                </div>

                <button type="submit">Enviar formulario</button>
                <button type="reset">Limpiar formulario</button>
            </form>

            <p id="resultado-formulario" role="status" aria-live="polite"></p>
        </section>
    </main>

    <footer>
        <p>F1 Apex | Proyecto académico sobre Fórmula 1.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/script.js"></script>
</body>
</html>
